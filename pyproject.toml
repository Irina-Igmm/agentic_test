[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_rag"
version = "0.1.0"
description = "Agentic RAG system combining local document knowledge with web search capabilities"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Data Science Team"}
]
dependencies = [
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-huggingface>=0.0.1",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "crewai>=0.28.0",
    "crewai-tools>=0.1.0",
    "python-dotenv>=1.0.0",
    "pypdf>=3.17.0",
    "pandas>=2.0.0",
    "langchain_ollama==0.3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py38"